<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przetarg App — rejestracja</title>
    <link rel="icon" type="image/png" href="/img/app.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

   
    <header class="relative z-10 border-b border-white/10 bg-black/40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 md:px-12 py-5 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a class="text-2xl font-black tracking-widest text-cyan-400 drop-shadow-[0_0_12px_rgba(34,211,238,0.8)]">
                    PRZETARG<span class="text-white"> APP</span>
                </a>
            </div>
            
            <nav class="hidden md:flex items-center space-x-8 text-xs font-bold tracking-widest text-slate-300 uppercase">
                <a href="index.html" class="hover:text-cyan-400 transition">Strona główna</a>
                <a href="PanelPrzetargow.html" class="hover:text-cyan-400 transition">Przetargi</a>
                <a href="#" class="hover:text-cyan-400 transition">Kontakt</a>
            </nav>

            <div>
                <a href="Logowanie.html" class="text-xs font-bold tracking-wider uppercase border border-pink-500/60 text-pink-400 px-5 py-2.5 rounded-full hover:bg-pink-500 hover:text-white transition shadow-[0_0_15px_rgba(236,72,153,0.3)]">
                    Logowanie
                </a>
            </div>
        </div>
    </header>


    <main class="flex-1 flex items-center justify-center p-4 my-8">
        <div class="max-w-lg w-full bg-slate-800/90 border border-slate-700 backdrop-blur-xl rounded-2xl shadow-2xl p-8 space-y-6">
            
            <div class="text-center space-y-1">
                <h1 class="text-3xl font-extrabold tracking-tight text-white">Dołącz do nas</h1>
                <p class="text-sm text-slate-400">Utwórz konto wykonawcy lub organizatora przetargów</p>
            </div>

        
            <div id="alertBox" class="hidden p-3.5 rounded-xl text-sm border font-medium"></div>

            <form class="space-y-4" id="rejestracjaForm">
                
           
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="imie" class="block text-xs font-semibold text-slate-400 mb-1">Imię</label>
                        <input
                            type="text"
                            id="imie"
                            required
                            placeholder="np. Jan"
                            class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
                        />
                    </div>
                    <div>
                        <label for="nazwisko" class="block text-xs font-semibold text-slate-400 mb-1">Nazwisko</label>
                        <input
                            type="text"
                            id="nazwisko"
                            required
                            placeholder="np. Kowalski"
                            class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
                        />
                    </div>
                </div>

            
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-400 mb-1">Adres e-mail</label>
                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="jan.kowalski@example.com"
                        class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
                    />
                </div>

             
                 <div>
                    <label for="telefon" class="block text-xs font-semibold text-slate-400 mb-1">Numer telefonu</label>
                    <input
                        type="tel"
                        id="telefon"
                        required
                        maxlength="9"
                        pattern="[0-9]{9}"
                        placeholder="np. 500600700"
                        class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
                    />
                </div> 

                <div>
                    <label for="rola" class="block text-xs font-semibold text-slate-400 mb-1">Rodzaj konta</label>
                    <select id="rola" class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition">
                        <option value="USER">Wykonawca — składam oferty</option>
                        <option value="ORGANIZER">Organizator — publikuję przetargi</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="haslo" class="block text-xs font-semibold text-slate-400 mb-1">Hasło</label>
                        <input
                            type="password"
                            id="haslo"
                            required
                            minlength="8"
                            placeholder="Min. 8 znaków"
                            class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
                        />
                    </div>
                    <div>
                        <label for="phaslo" class="block text-xs font-semibold text-slate-400 mb-1">Powtórz hasło</label>
                        <input
                            type="password"
                            id="phaslo"
                            required
                            minlength="8"
                            placeholder="Min. 8 znaków"
                            class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"
                        />
                    </div>
                </div>

        
                <button
                    type="submit"
                    class="w-full mt-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-cyan-500/20 transition duration-200"
                >
                    Utwórz konto
                </button>

                <div class="text-center pt-2 text-sm text-slate-400">
                    Masz już konto?
                    <a href="Logowanie.html" class="text-cyan-400 hover:text-cyan-300 font-semibold transition ml-1">
                        Zaloguj się
                    </a>
                </div>
            </form>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        &copy; 2026 Przetarg App. Wszelkie prawa zastrzeżone.
    </footer>

   
    <script>
        const form = document.getElementById('rejestracjaForm');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');

            const haslo = document.getElementById('haslo').value;
            const phaslo = document.getElementById('phaslo').value;

            if (haslo !== phaslo) {
                alertBox.className = 'p-3.5 rounded-xl text-sm border font-medium bg-rose-950/80 text-rose-300 border-rose-800';
                alertBox.textContent = 'Hasła nie są identyczne!';
                alertBox.classList.remove('hidden');
                return;
            }

            const dane = {
                imie: document.getElementById('imie').value.trim(),
                nazwisko: document.getElementById('nazwisko').value.trim(),
                telefon: document.getElementById('telefon').value.trim(),
                email: document.getElementById('email').value.trim(),
                haslo: haslo,
                rola: document.getElementById('rola').value
            };

            try {
                const csrfResponse = await fetch('/api/csrf');
                if (!csrfResponse.ok) throw new Error('Nie udało się pobrać tokenu bezpieczeństwa.');
                const csrf = await csrfResponse.json();
                const response = await fetch('/api/users/rejestracja', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [csrf.headerName]: csrf.token },
                    credentials: 'same-origin',
                    body: JSON.stringify(dane)
                });

                if (!response.ok) {
                    const errDane = await response.json().catch(() => null);
                    const komunikat = errDane?.message
                        || errDane?.detail
                        || errDane?.title
                        || (response.status === 409
                            ? 'Konto z podanym adresem e-mail lub numerem telefonu już istnieje.'
                            : response.status === 400
                                ? 'Sprawdź wymagane pola, format telefonu oraz długość hasła (minimum 8 znaków).'
                                : `Rejestracja nie powiodła się (błąd ${response.status}).`);
                    throw new Error(komunikat);
                }

                alertBox.className = 'p-3.5 rounded-xl text-sm border font-medium bg-cyan-950/80 text-cyan-300 border-cyan-800';
                alertBox.textContent = 'Konto zostało utworzone! Przekierowanie do logowania...';
                alertBox.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'Logowanie.html';
                }, 1200);

            } catch (error) {
                alertBox.className = 'p-3.5 rounded-xl text-sm border font-medium bg-rose-950/80 text-rose-300 border-rose-800';
                alertBox.textContent = error.message;
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
