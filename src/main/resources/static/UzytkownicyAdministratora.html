<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Administracja kontami użytkowników Przetarg App.">
    <link rel="icon" type="image/png" href="/img/app.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Przetarg App — zarządzanie użytkownikami</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-950">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-6 py-5">
            <a href="PanelAdministratora.html" class="text-xl font-black text-white">PRZETARG<span class="text-cyan-400"> APP</span></a>
            <nav class="flex flex-wrap items-center gap-3" aria-label="Nawigacja administratora">
                <a href="PanelAdministratora.html" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:border-cyan-400 hover:text-white">Panel administracyjny</a>
                <a href="PanelPrzetargow.html" class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:border-cyan-400 hover:text-white">Przetargi i oferty</a>
                <button id="logout" class="rounded-lg border border-slate-700 px-4 py-2 text-sm hover:border-rose-400 hover:text-rose-300">Wyloguj</button>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-7xl space-y-8 px-6 py-10">
        <section>
            <p class="text-xs font-bold uppercase tracking-widest text-cyan-400">Administracja</p>
            <h1 class="mt-2 text-3xl font-black text-white">Zarządzanie użytkownikami</h1>
            <p class="mt-2 text-sm text-slate-400">Twórz konta i zarządzaj rolami, hasłami oraz dostępem.</p>
        </section>

        <div id="pageMessage" class="hidden rounded-lg p-4 text-sm" role="status" aria-live="polite"></div>

        <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
            <h2 class="text-xl font-bold">Utwórz konto</h2>
            <form id="createUserForm" class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                <label class="text-sm text-slate-300">Imię
                    <input name="imie" required maxlength="100" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-white">
                </label>
                <label class="text-sm text-slate-300">Nazwisko
                    <input name="nazwisko" required maxlength="100" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-white">
                </label>
                <label class="text-sm text-slate-300">Telefon
                    <input name="telefon" type="tel" required minlength="9" maxlength="9" pattern="[0-9]{9}" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-white">
                </label>
                <label class="text-sm text-slate-300">E-mail
                    <input name="email" type="email" required maxlength="254" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-white">
                </label>
                <label class="text-sm text-slate-300">Hasło (min. 8 znaków)
                    <input name="haslo" type="password" required minlength="8" maxlength="100" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-white">
                </label>
                <label class="text-sm text-slate-300">Rola
                    <select name="rola" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-white">
                        <option value="USER">Wykonawca</option>
                        <option value="ORGANIZER">Organizator</option>
                    </select>
                </label>
                <button class="w-fit rounded-lg bg-cyan-400 px-5 py-2.5 font-bold text-slate-950 hover:bg-cyan-300 sm:col-span-2 lg:col-span-3">Utwórz konto</button>
            </form>
        </section>

        <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
            <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
                <div>
                    <h2 class="text-xl font-bold">Konta</h2>
                    <p id="userCount" class="mt-1 text-sm text-slate-400"></p>
                </div>
                <form id="searchForm" class="flex gap-2">
                    <label class="sr-only" for="userQuery">Szukaj użytkowników</label>
                    <input id="userQuery" name="query" type="search" placeholder="Imię, nazwisko lub e-mail" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-white sm:w-72">
                    <button class="rounded-lg border border-slate-700 px-4 py-2 text-sm hover:border-cyan-400">Szukaj</button>
                </form>
            </div>
            <div class="mt-5 overflow-x-auto">
                <table class="w-full min-w-[760px] text-left text-sm">
                    <thead class="border-b border-slate-800 text-xs uppercase tracking-wide text-slate-400">
                        <tr>
                            <th class="px-3 py-3">Użytkownik</th>
                            <th class="px-3 py-3">Telefon</th>
                            <th class="px-3 py-3">Rola</th>
                            <th class="px-3 py-3">Reset hasła</th>
                            <th class="px-3 py-3">Akcje</th>
                        </tr>
                    </thead>
                    <tbody id="users" class="divide-y divide-slate-800">
                        <tr><td colspan="5" class="px-3 py-5 text-slate-400">Wczytywanie kont…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">&copy; 2026 Przetarg App</footer>

    <script>
        (() => {
            const pageMessage = document.getElementById('pageMessage');
            const usersContainer = document.getElementById('users');

            async function api(path, options = {}) {
                const method = (options.method || 'GET').toUpperCase();
                const headers = new Headers(options.headers || {});
                if (!['GET', 'HEAD', 'OPTIONS', 'TRACE'].includes(method)) {
                    const csrfResponse = await fetch('/api/csrf', { credentials: 'same-origin' });
                    if (!csrfResponse.ok) throw new Error('Nie udało się pobrać tokenu bezpieczeństwa.');
                    const csrf = await csrfResponse.json();
                    headers.set(csrf.headerName, csrf.token);
                }
                const response = await fetch(path, { ...options, headers, credentials: 'same-origin' });
                const text = response.status === 204 ? '' : await response.text();
                let body = null;
                if (text) {
                    try {
                        body = JSON.parse(text);
                    } catch {
                        body = text;
                    }
                }
                if (!response.ok) {
                    throw new Error(body?.detail || body?.message || (typeof body === 'string' ? body : null)
                        || 'Nie udało się wykonać operacji.');
                }
                return body;
            }

            function showMessage(message, success = false) {
                pageMessage.textContent = message;
                pageMessage.className = `rounded-lg p-4 text-sm ${success ? 'bg-emerald-950 text-emerald-300' : 'bg-rose-950 text-rose-300'}`;
            }

            function textCell(row, value, className = '') {
                const cell = document.createElement('td');
                cell.className = `px-3 py-3 ${className}`;
                cell.textContent = value;
                row.append(cell);
                return cell;
            }

            async function loadUsers() {
                const query = document.getElementById('userQuery').value.trim();
                const users = await api(`/api/users/admin${query ? `?query=${encodeURIComponent(query)}` : ''}`);
                document.getElementById('userCount').textContent = `${users.length} kont`;
                usersContainer.replaceChildren();
                if (!users.length) {
                    const row = document.createElement('tr');
                    const cell = textCell(row, 'Nie znaleziono kont.', 'text-slate-400');
                    cell.colSpan = 5;
                    usersContainer.append(row);
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement('tr');
                    textCell(row, `${user.imie} ${user.nazwisko}\n${user.email}`, 'whitespace-pre-line');
                    textCell(row, user.telefon);

                    const roleCell = document.createElement('td');
                    roleCell.className = 'px-3 py-3';
                    const role = document.createElement('select');
                    role.className = 'rounded border border-slate-700 bg-slate-950 px-2 py-1 text-white';
                    const roleOptions = user.rola === 'ADMIN'
                        ? [['ADMIN', 'Administrator']]
                        : [['USER', 'Wykonawca'], ['ORGANIZER', 'Organizator']];
                    roleOptions.forEach(([value, label]) => {
                        const option = document.createElement('option');
                        option.value = value;
                        option.textContent = label;
                        option.selected = user.rola === value;
                        role.append(option);
                    });
                    role.disabled = user.rola === 'ADMIN';
                    roleCell.append(role);
                    row.append(roleCell);

                    const passwordCell = document.createElement('td');
                    passwordCell.className = 'px-3 py-3';
                    const passwordForm = document.createElement('form');
                    passwordForm.className = 'flex gap-2';
                    const password = document.createElement('input');
                    password.type = 'password';
                    password.required = true;
                    password.minLength = 8;
                    password.maxLength = 100;
                    password.placeholder = 'Nowe hasło';
                    password.setAttribute('aria-label', `Nowe hasło dla ${user.email}`);
                    password.className = 'w-36 rounded border border-slate-700 bg-slate-950 px-2 py-1 text-white';
                    const resetButton = document.createElement('button');
                    resetButton.textContent = 'Ustaw';
                    resetButton.className = 'rounded border border-slate-700 px-2 py-1 hover:border-cyan-400';
                    passwordForm.append(password, resetButton);
                    passwordCell.append(passwordForm);
                    row.append(passwordCell);

                    const actions = document.createElement('td');
                    actions.className = 'px-3 py-3';
                    const saveRole = document.createElement('button');
                    saveRole.type = 'button';
                    saveRole.textContent = 'Zapisz rolę';
                    saveRole.className = 'rounded border border-slate-700 px-2 py-1 hover:border-cyan-400';
                    saveRole.disabled = user.rola === 'ADMIN';
                    const remove = document.createElement('button');
                    remove.type = 'button';
                    remove.textContent = 'Usuń';
                    remove.className = 'ml-2 rounded border border-rose-900 px-2 py-1 text-rose-300 hover:bg-rose-950';
                    remove.disabled = user.rola === 'ADMIN';
                    actions.append(saveRole, remove);
                    row.append(actions);

                    saveRole.addEventListener('click', async () => {
                        saveRole.disabled = true;
                        try {
                            await api(`/api/users/admin/${encodeURIComponent(user.id)}/rola`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ rola: role.value })
                            });
                            showMessage('Rola użytkownika została zmieniona.', true);
                            await loadUsers();
                        } catch (error) {
                            showMessage(error.message);
                        } finally {
                            saveRole.disabled = false;
                        }
                    });

                    passwordForm.addEventListener('submit', async event => {
                        event.preventDefault();
                        resetButton.disabled = true;
                        try {
                            await api(`/api/users/admin/${encodeURIComponent(user.id)}/haslo`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ haslo: password.value })
                            });
                            passwordForm.reset();
                            showMessage('Hasło zostało zmienione.', true);
                        } catch (error) {
                            showMessage(error.message);
                        } finally {
                            resetButton.disabled = false;
                        }
                    });

                    remove.addEventListener('click', async () => {
                        if (!window.confirm(`Czy na pewno usunąć konto ${user.email}?`)) return;
                        remove.disabled = true;
                        try {
                            await api(`/api/users/admin/${encodeURIComponent(user.id)}`, { method: 'DELETE' });
                            showMessage('Konto zostało usunięte.', true);
                            await loadUsers();
                        } catch (error) {
                            showMessage(error.message);
                        } finally {
                            remove.disabled = false;
                        }
                    });
                    usersContainer.append(row);
                });
            }

            document.getElementById('createUserForm').addEventListener('submit', async event => {
                event.preventDefault();
                const form = event.currentTarget;
                try {
                    await api('/api/users/admin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(Object.fromEntries(new FormData(form).entries()))
                    });
                    form.reset();
                    showMessage('Konto zostało utworzone.', true);
                    await loadUsers();
                } catch (error) {
                    showMessage(error.message);
                }
            });

            document.getElementById('searchForm').addEventListener('submit', async event => {
                event.preventDefault();
                try {
                    await loadUsers();
                } catch (error) {
                    showMessage(error.message);
                }
            });

            document.getElementById('logout').addEventListener('click', async () => {
                try {
                    await api('/api/users/logout', { method: 'POST' });
                    window.location.replace('Logowanie.html');
                } catch (error) {
                    showMessage(error.message);
                }
            });

            loadUsers().catch(error => showMessage(error.message));
        })();
    </script>
</body>
</html>
