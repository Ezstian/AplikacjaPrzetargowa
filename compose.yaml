name: przetarg-app

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-przetarg_app_db}
      POSTGRES_USER: ${DB_USERNAME:-przetarg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-przetarg_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-przetarg_app_db}
      DB_USERNAME: ${DB_USERNAME:-przetarg}
      DB_PASSWORD: ${DB_PASSWORD:-przetarg_dev_password}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_PHONE: ${ADMIN_PHONE:-666999666}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
